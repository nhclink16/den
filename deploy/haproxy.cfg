global
    user haproxy
    group haproxy
    daemon
    maxconn 1024

defaults
    mode tcp
    timeout connect 5s
    timeout client 1h
    timeout server 1h

# LiveKit 1.9.0 advertises built-in TURN/TLS at :443 regardless of tls_port.
# HTTP ALPN goes to Caddy; non-HTTP TLS for the rtc name goes to TURN :5349.
frontend den_tls
    bind :443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    acl rtc_name req.ssl_sni -i rtc.den.nicholascaron.com
    acl http_alpn req.ssl_alpn -m sub h2 http/1.1
    use_backend turn_tls if rtc_name !http_alpn
    default_backend caddy_tls

backend caddy_tls
    server caddy 127.0.0.1:8443 check

backend turn_tls
    server livekit 127.0.0.1:5349 check
