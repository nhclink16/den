# Rendered by install-vps.sh with fresh credentials on the VPS.
port: 7880
bind_addresses: ["0.0.0.0"]
rtc:
  use_external_ip: true
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  enable_loopback_candidate: false
  interfaces:
    excludes: ["tailscale0"]
turn:
  enabled: true
  domain: rtc.denchat.app
  tls_port: 5349
  udp_port: 3478
  cert_file: /etc/livekit/certs/turn.crt
  key_file: /etc/livekit/certs/turn.key
logging:
  level: warn
keys:
  ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
webhook:
  api_key: ${LIVEKIT_API_KEY}
  urls: ["http://127.0.0.1:7000/livekit/webhook"]
