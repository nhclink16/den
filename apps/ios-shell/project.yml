name: DenShell
options:
  bundleIdPrefix: app.denchat
  # iOS 17.0 is the floor: the web app's popovers and AVAudioApplication both need it.
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '27.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: UH434K44A3
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '0.4.0'
    CURRENT_PROJECT_VERSION: '4'
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    exactVersion: 2.17.0
targets:
  DenShell:
    type: application
    platform: iOS
    sources: DenShell
    dependencies:
      - package: LiveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.denchat.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
      # Which APNs the device token belongs to, told to the server with it. Xcode and simulator builds are signed for
      # development (sandbox); TestFlight and App Store builds for production.
      configs:
        Debug:
          DEN_APNS_ENVIRONMENT: sandbox
        Release:
          DEN_APNS_ENVIRONMENT: production
    info:
      path: DenShell/Info.plist
      properties:
        CFBundleDisplayName: Den
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Same answer as the old app's TestFlight builds, so cloud builds don't wait on a compliance question.
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: Use your microphone in Den calls.
        NSCameraUsageDescription: Share your camera in Den calls.
        DenAPNSEnvironment: $(DEN_APNS_ENVIRONMENT)
        UIBackgroundModes:
          - audio
          - voip
    # Xcode swaps in "production" when it signs an archive for TestFlight or the App Store.
    entitlements:
      path: DenShell/DenShell.entitlements
      properties:
        aps-environment: development
  DenShellTests:
    type: bundle.unit-test
    platform: iOS
    sources: DenShellTests
    dependencies:
      - target: DenShell
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.denchat.ios.tests
  DenShellUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: DenShellUITests
    dependencies:
      - target: DenShell
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.denchat.ios.uitests
schemes:
  DenShell:
    build:
      targets:
        DenShell: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DenShellTests
    archive:
      config: Release
  # Xcode Cloud's "UI check" workflow: screenshots against a made-up Den on the runner (ci_scripts/ci_pre_xcodebuild.sh).
  # Its test plan turns off xcodebuild's simulator diagnostics, which waited 10 minutes after any failure.
  DenShellUI:
    build:
      targets:
        DenShell: all
    test:
      config: Debug
      targets:
        - DenShellUITests
      testPlans:
        - path: DenShellUI.xctestplan
          defaultPlan: true
