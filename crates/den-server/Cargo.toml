[package]
name = "den-server"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only"
description = "Den chat server: REST + WebSocket over SQLite, issues LiveKit tokens"

[dependencies]
den-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum = { version = "0.8", features = ["ws", "http2"] }
utoipa.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
# AEAD for refresh tokens at rest. Already in the lock via rustls; never hand-roll crypto.
ring = "0.17"
ulid = "1"
tower-http = { version = "0.6", features = ["fs"] }
tower = { version = "0.5", features = ["util"] }
fs2 = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

livekit-api = { version = "=0.7.1", default-features = false, features = ["access-token", "webhooks", "services", "rustls-tls-native-roots"] }

base64 = "0.22"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
jsonwebtoken = { version = "10.4", features = ["rust_crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }

unicode-segmentation = "1.13"
symphonia = { version = "=0.5.5", default-features = false, features = ["ogg", "vorbis", "mp3", "wav", "pcm"] }

[dev-dependencies]
den-host = { path = "../den-host" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
livekit-protocol = "=0.7.13"
prost = "0.12"
