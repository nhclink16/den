name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
          - platform: macos-arm64
            runner: macos-15
          - platform: windows-x86_64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        if: matrix.platform == 'linux-x86_64'
        with:
          node-version: '22'
      - name: Build and package
        shell: bash
        run: bash deploy/package-release.sh '${{ matrix.platform }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: release-artifacts/den-*
          if-no-files-found: error
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - runner: macos-15
            target: universal-apple-darwin
            bundles: dmg,app
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/desktop-target
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libsecret-1-dev
      - name: Universal macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install web and desktop dependencies
        shell: bash
        run: |
          npm ci --prefix apps/web
          npm ci --prefix apps/desktop
      - name: Signed and notarized desktop build
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        uses: tauri-apps/tauri-action@v0
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Desktop build without Apple signing
        if: runner.os != 'macOS' || env.APPLE_CERTIFICATE == ''
        shell: bash
        run: npm --prefix apps/desktop run tauri -- build --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            desktop-target/**/bundle/**/*.dmg
            desktop-target/**/bundle/**/*.app.tar.gz*
            desktop-target/**/bundle/**/*.msi*
            desktop-target/**/bundle/**/*.exe*
            desktop-target/**/bundle/**/*.AppImage*
            desktop-target/**/bundle/**/*.deb
          if-no-files-found: error
  publish:
    needs: [build, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - run: python3 deploy/desktop-release.py "$GITHUB_REF_NAME"
      - run: bash deploy/finalize-release.sh "$GITHUB_REF_NAME"
      - name: Publish binaries, matching source, and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-artifacts/* --verify-tag --title "Den $GITHUB_REF_NAME" --generate-notes
