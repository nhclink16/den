name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
          - platform: macos-arm64
            runner: macos-15
          - platform: windows-x86_64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        if: matrix.platform == 'linux-x86_64'
        with:
          node-version: '22'
      - name: Build and package
        shell: bash
        run: bash deploy/package-release.sh '${{ matrix.platform }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: release-artifacts/den-*
          if-no-files-found: error
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
            args: --linux AppImage deb --x64
            arch: x64
          - runner: macos-15
            platform: darwin
            args: --mac dmg zip --universal
            arch: universal
          - runner: windows-2022
            platform: win32
            args: --win nsis msi --x64
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      CSC_LINK: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
      CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
      WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install web and desktop dependencies
        shell: bash
        run: |
          npm ci --prefix apps/web
          npm ci --prefix apps/desktop
      - name: Check desktop and web
        shell: bash
        run: |
          npm --prefix apps/desktop test
          npm --prefix apps/web run check
      - name: Build Electron installers
        shell: bash
        run: npm --prefix apps/desktop run build -- ${{ matrix.args }}
      - name: Sign updater manifest with the existing Den update key
        shell: bash
        run: |
          node deploy/electron-manifest.cjs apps/desktop/dist '${{ matrix.platform }}' '${{ matrix.arch }}'
          apps/desktop/node_modules/.bin/tauri signer sign 'apps/desktop/dist/electron-${{ matrix.platform }}-${{ matrix.arch }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.msi
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/electron-*.json*
          if-no-files-found: error
  publish:
    needs: [build, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - run: bash deploy/finalize-release.sh "$GITHUB_REF_NAME"
      - name: Publish binaries, matching source, and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-artifacts/* --verify-tag --title "Den $GITHUB_REF_NAME" --generate-notes
