name: Music publisher
on:
  push:
    paths: ['tools/den-dj/**', 'scripts/install-music.sh', '.github/workflows/music.yml']
  pull_request:
    paths: ['tools/den-dj/**', 'scripts/install-music.sh', '.github/workflows/music.yml']
jobs:
  publisher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: tools/den-dj/go.sum
      - run: go vet ./...
        working-directory: tools/den-dj
      - run: go build ./...
        working-directory: tools/den-dj
      - run: sh -n scripts/install-music.sh
