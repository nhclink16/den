name: Web client
on:
  push:
    paths: ['apps/web/**', 'scripts/*.ts', 'scripts/m9-contrast.mjs', 'scripts/npm-ci.sh', '.github/workflows/web.yml']
  pull_request:
    paths: ['apps/web/**', 'scripts/*.ts', 'scripts/m9-contrast.mjs', 'scripts/npm-ci.sh', '.github/workflows/web.yml']
jobs:
  check-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: bash scripts/npm-ci.sh --prefix apps/web
      - run: npm --prefix apps/web run check
      - run: node --experimental-strip-types --test scripts/streams-source.test.ts scripts/m7c-layout.test.ts scripts/mentions.test.ts scripts/login-pattern.test.ts scripts/canvas-attachments.test.ts scripts/conversation-drafts.test.ts scripts/read-state.test.ts
      - run: npm --prefix apps/web run build
